input:
  csv: C:\Users\Robin\Documents\THESE_CODE\PROJET_META_ANALYSE\Data_manadgement\outputs\baseline_raw_11161356\data\gain_loss_responses\mni_site_csv\mni_sites_positive_Beta_with_t_value.csv
  x_column: x
  y_column: y
  z_column: z
  color_column: color
  label_column: label
  id_column: site_id
  status_column: status
  tvalue_column: t_value
  area_column: insula_area_for_dv
  dv_group_column: insula_dv_group
atlas:
  parcellation: julich 3.1
  space: mni152
  region_codes:
  - Ig1
  - Ig2
  - Ig3
  - Ia1
  - Ia2
  - Ia3
  - Id1
  - Id2
  - Id3
  - Id4
  - Id5
  - Id6
  - Id7
  - Id8
  - Id9
  - Id10
  probability_threshold: 0.05  # threshold used for voxelwise site/atlas assignment
  # Linear interpolation of each Julich probability map to fsLR before winner-takes-all.
  # Raise toward 0.12-0.18 to trim weak voxel-grid fringes; lower toward 0.04-0.06 to retain more cortex.
  surface_probability_threshold: 0.08
surface:
  density: 32k
  marker_radius_mm: 5.0
  fallback_marker_radii_mm:
  - 7.5
  - 10.0
  - 12.5
  - 15.0
  # Only used for sites still not projected after batch retries; each is transformed alone
  # to prevent nearby contacts competing for the same labelled voxels.
  last_resort_marker_radii_mm:
  - 10.0
  - 15.0
  - 20.0
  - 25.0
  - 30.0
  - 35.0
  - 40.0
  snap_to_insula: true
  # Retained as a QC reference for legacy/out-of-group projections. A valid manual
  # D/V assignment is snapped to its nearest Julich D/V surface without a hard
  # 6-mm rejection threshold; the actual distance is saved in the CSV.
  max_snap_distance_mm: 6.0
plot:
  marker_size: 15
  # Display-only separation for contacts sharing (or nearly sharing) one fsLR vertex.
  # Both contacts are displaced symmetrically in the local tangent plane.
  overlap_detect_distance_mm: 0.80
  overlap_offset_mm: 1.55
  overlap_tangent_neighborhood_mm: 5.0
  flatmap_overlap_detect_distance: 0.00001
  flatmap_overlap_offset: 0.020
  dpi: 300
  elev: 18
  left_azim: 180
  right_azim: 0
  output_dir: outputs_test
  figure_name: insula_sites_fslr32k.png
  save_separate_hemispheres: true
  context_distance_mm: 48.0
  context_smoothing_rings: 3
  context_color: '#D9DDE2'
  context_alpha: 0.12
  parcel_alpha: 1.0
  context_shading_strength: 0.62
  context_ambient: 0.62
  parcel_shading_strength: 0.22
  parcel_ambient: 0.78
  projection_type: persp
  focal_length: 0.92
  marker_edge_width: 0.35
  marker_edge_color: '#292929'
  point_offset_mm: 0.0
  zoom_to_insula_only: true
  zoom_context_margin_mm: 5.0
  zoom_padding_fraction: 0.1
  zoom_min_padding_mm: 5.0
  export_workbench: true
  bilateral_figsize:
  - 14.0
  - 8.0
  combined_figsize:
  - 10.5
  - 8.0
  single_figsize:
  - 8.5
  - 7.5
  save_tvalue_multiview: true
  title: Insular sites on fsLR inflated surface
  title_fontsize: 14
  show_category_legend: true
  dorsal_regions:
  - id4
  - id6
  - id7
  ventral_regions:
  - ia2
  - ia3
  - id8
  - id9
  - id10
  status_colors:
    gain_only: '#2E9D55'
    loss_only: '#B9824A'
    both: '#8C564B'
    both_prefer_gain: '#A66A50'
    both_prefer_loss: '#68483F'
  area_column: area
  unselected_region_color: '#D7DCE1'
  parcel_boundary_color: '#777E87'
  parcel_boundary_linewidth: 0.7
  dv_boundary_color: '#C62828'
  dv_boundary_offset_mm: 0.65
  dv_boundary_linewidth: 2.0
  legend_fontsize: 8.0
  side_title_fontsize: 11
  max_site_extent_from_insula_mm: 30.0
  region_legend_ncol: 8
  combined_target_hemisphere: right
  dv_group_colors:
    Dorsale: '#D95F59'
    Ventrale: '#4C83B6'
  legend_title_fontsize: 9
  tvalue_cmap: coolwarm
  tvalue_vlim: 12.5
  colorbar_label_fontsize: 10
  colorbar_tick_fontsize: 8
  save_flatmaps: true
  flatmap_grow_rings: 1
  flatmap_marker_size: 11
  flatmap_marker_edge_width: 0.35
  flatmap_boundary_linewidth: 0.65
  flatmap_dv_linewidth: 1.8
  flatmap_show_dv_region_labels: true
  flatmap_min_label_vertices: 3
  flatmap_region_fontsize: 6.5
  flatmap_region_text_color: '#20252B'
  flatmap_context_color: '#D9DDE2'
  flatmap_margin: 0.055
  flatmap_show_orientation: true
  flatmap_combined_figsize:
  - 12.0
  - 8.0
  flatmap_bilateral_figsize:
  - 15.0
  - 8.0
  flatmap_title: Insula flatmap — Julich-Brain on fsLR
  # Only parcels containing at least one displayed site stay saturated; other insular parcels are grey.
  show_only_regions_with_sites: true
  # Colour contrast for occupied parcels (1.0 = palette as defined; >1 increases contrast).
  parcel_color_contrast: 1.18
  unclassified_site_region_color: '#AEB6BF' 
  family_region_colors:
    id4: '#B94F45'
    id6: '#D46D5F'
    id7: '#E99B8E'
    ia2: '#2E718F'
    ia3: '#438BA5'
    id8: '#62A6BA'
    id9: '#8BC1CE'
    id10: '#B4D9E0'
  # Additional display-only view that compresses local fold depth around the insula.
  save_fold_flattened_view: true
  # 0 = original shape; 0.75 compresses 75% of local PCA-normal depth on the insula.
  fold_flatten_strength: 0.75
  fold_flatten_fade_mm: 28.0
  zoom_include_projected_sites: true
  filled_marker_max_projection_radius_mm: 7.5
  flatmap_site_snap_distance_mm: 20.0
